# Keeps routine.cpp in step with the robot code (will12liu/4787T-Titanium-Vex-Override, public).
# A changed routine is committed here, which makes Cloudflare Pages redeploy the sim.
name: Sync auton routine from robot code
on:
  schedule: [{ cron: "17 * * * *" }]   # hourly
  workflow_dispatch:                     # "Run workflow" button in the Actions tab
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: will12liu/4787T-Titanium-Vex-Override
          ref: main
          path: robot
          sparse-checkout: src/routine.cpp
      - name: Commit if the routine changed
        run: |
          cp robot/src/routine.cpp routine.cpp
          rm -rf robot
          if git diff --quiet -- routine.cpp; then echo "No change"; exit 0; fi
          git config user.name "routine-sync"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Sync auton routine from 4787T-Titanium-Vex-Override" -- routine.cpp
          git push
